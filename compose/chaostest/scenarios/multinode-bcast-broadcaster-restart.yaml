id: multinode-bcast-broadcaster-restart
name: Broadcaster restart - a tx mined while it was down still reaches MINED
description: >
  A spend reaches SEEN_ON_NETWORK, then the broadcaster container is stopped and a block
  containing the tx is mined. merkle-service's callbacks fail while it is down. After a start
  the broadcaster must keep its record of the tx (pebble store on the container filesystem),
  catch up on the block, and report MINED in it with a valid proof.
requires: [regtest]
roles:
  A: teranode1
  B: teranode2
  C: teranode3
params:
  fee: 500
  downSeconds: 20
steps:
  - name: converge - mine on A
    action: mine
    with: { node: A, blocks: 1 }
    assert:
      - { check: same_tip, with: { nodes: [A, B, C] }, timeout: 90s }

  - name: fund - mine to coinbase maturity on A
    action: mine
    with: { node: A, blocks: 101 }
    as: fund
    timeout: 10m
    assert:
      - { check: same_tip, with: { nodes: [A, B, C] }, timeout: 120s }

  - name: recipient key
    action: newkey
    with: { name: "bcast-restart-${fund.last}" }
    as: recipient

  - name: a mature coinbase
    action: coinbase
    with: { node: A, height: "${tip(A) - 100}" }
    as: cb

  - name: spend it to the recipient
    action: spend
    with: { node: A, txid: "${cb.txid}", vout: 0, key: miner, to: "${recipient.name}", fee: "${fee}" }
    as: tx

  - name: submit to the broadcaster
    action: submit
    with: { target: arcade, tx: "${tx}" }
    as: submitted
    assert:
      - { check: expr, with: { left: "${submitted.accepted}", right: "true" } }
      - check: arcade_tx_status
        with: { txid: "${tx.txid}", status: "SEEN_ON_NETWORK|SEEN_MULTIPLE_NODES" }
        timeout: 60s

  - name: stop the broadcaster
    action: chaos
    with: { node: arcade, action: stop }

  - name: mine the tx while it is down
    action: mine
    with: { node: A, blocks: 1 }
    as: blk
    assert:
      - { check: same_tip, with: { nodes: [A, B, C] }, timeout: 60s }

  - name: stay down
    action: wait
    with: { seconds: "${downSeconds}" }

  - name: start the broadcaster
    action: chaos
    with: { node: arcade, action: start }
    assert:
      - check: arcade_tx_status
        with: { txid: "${tx.txid}", status: MINED, block: "${blk.last}", proof: true }
        timeout: 5m
        message: MINED after the restart, in the block mined while it was down
