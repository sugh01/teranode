id: multinode-bcast-merkle-outage
name: Broadcaster through a Merkle Service outage - MINED still arrives after recovery
description: >
  A spend reaches SEEN_ON_NETWORK, then merkle-service is paused and a block containing the tx
  is mined. While it is down nobody can build the proof, so the broadcaster must not report
  MINED. Once it is unpaused, the retry and reprocess path must deliver MINED in that block
  with a valid proof, without another block or a resubmit.
requires: [regtest]
roles:
  A: teranode1
  B: teranode2
  C: teranode3
params:
  fee: 500
  outageSeconds: 30
steps:
  - name: converge - mine on A
    action: mine
    with: { node: A, blocks: 1 }
    assert:
      - { check: same_tip, with: { nodes: [A, B, C] }, timeout: 90s }

  - name: fund - mine to coinbase maturity on A
    action: mine
    with: { node: A, blocks: 101 }
    as: fund
    timeout: 10m
    assert:
      - { check: same_tip, with: { nodes: [A, B, C] }, timeout: 120s }

  - name: recipient key
    action: newkey
    with: { name: "bcast-merkle-${fund.last}" }
    as: recipient

  - name: a mature coinbase
    action: coinbase
    with: { node: A, height: "${tip(A) - 100}" }
    as: cb

  - name: spend it to the recipient
    action: spend
    with: { node: A, txid: "${cb.txid}", vout: 0, key: miner, to: "${recipient.name}", fee: "${fee}" }
    as: tx

  - name: submit to the broadcaster
    action: submit
    with: { target: arcade, tx: "${tx}" }
    as: submitted
    assert:
      - { check: expr, with: { left: "${submitted.accepted}", right: "true" } }
      - check: arcade_tx_status
        with: { txid: "${tx.txid}", status: "SEEN_ON_NETWORK|SEEN_MULTIPLE_NODES" }
        timeout: 60s

  - name: pause merkle-service
    action: chaos
    with: { node: merkle-service, action: pause }

  - name: mine the tx while merkle-service is down
    action: mine
    with: { node: A, blocks: 1 }
    as: blk
    assert:
      - { check: same_tip, with: { nodes: [A, B, C] }, timeout: 60s }

  - name: hold the outage
    action: wait
    with: { seconds: "${outageSeconds}" }
    assert:
      - check: arcade_tx_status
        with: { txid: "${tx.txid}", status: "SEEN_ON_NETWORK|SEEN_MULTIPLE_NODES|ACCEPTED_BY_NETWORK" }
        timeout: 1s
        message: no MINED without a proof while merkle-service is down
        should: true

  - name: unpause merkle-service
    action: chaos
    with: { node: merkle-service, action: unpause }
    assert:
      - check: arcade_tx_status
        with: { txid: "${tx.txid}", status: MINED, block: "${blk.last}", proof: true }
        timeout: 5m
        message: MINED arrives after recovery, in the original block, with a valid proof
